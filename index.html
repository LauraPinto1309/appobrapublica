<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ObraGest — Gestión de Proyectos de Obra Pública</title>
<meta name="description" content="App para gestionar proyectos de obra pública en equipo: tareas, subproyectos, tiempos y avances.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-icon">🏗️</span>
      <div><strong>ObraGest</strong><small>Obra pública en equipo</small></div>
    </div>
    <nav class="nav" id="mainNav">
      <button data-view="dashboard" class="active">📊 Panel</button>
      <button data-view="proyectos">🏛️ Proyectos</button>
      <button data-view="kanban">🗂️ Tareas · Kanban</button>
      <button data-view="gantt">🕓 Tiempos · Gantt</button>
      <button data-view="equipo">👷 Equipo</button>
      <button data-view="avances">📈 Avances</button>
      <button data-view="informes">🧾 Informes</button>
    </nav>
    <div class="sidebar-foot">
      <div class="storage-info"><span id="storageInfo">—</span></div>
      <div class="btn-row">
        <button class="btn ghost sm" id="btnExport" title="Exportar JSON">⬇ JSON</button>
        <button class="btn ghost sm" id="btnImport" title="Importar JSON">⬆ Import</button>
        <input type="file" id="fileImport" accept=".json" hidden>
      </div>
      <button class="btn danger sm full" id="btnReset">↺ Restablecer demo</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="btn ghost icon-only" id="btnMenu" aria-label="Menú">☰</button>
      <div class="search-wrap"><input id="globalSearch" type="search" placeholder="🔎 Buscar proyecto, tarea, miembro… ( / )"></div>
      <div class="top-actions">
        <select id="filterProject" title="Filtrar por proyecto"><option value="">Todos los proyectos</option></select>
        <button class="btn primary" id="btnQuickTask">＋ Tarea</button>
        <button class="btn secondary" id="btnQuickProject">＋ Proyecto</button>
      </div>
    </header>
    <main id="view" class="view"></main>
    <footer class="foot">ObraGest · datos guardados en localStorage del navegador · listo para GitHub Pages · <span id="year"></span></footer>
  </div>
</div>

<!-- Modal root -->
<div class="modal-backdrop" id="modalBackdrop" hidden><div class="modal" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div class="toast-wrap" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
